name: Reserva CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reserva-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, sqlite3, pdo_sqlite, dom, xml, xmlwriter
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force

      - name: PHP syntax gate
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install frontend dependencies
        run: |
          npm install --global npm@10
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Package local validation bundle
        run: |
          extension_dir="$(php -r 'echo ini_get("extension_dir");')"
          mkdir -p .local-php-ext
          for extension in dom mbstring xml xmlreader xmlwriter simplexml pdo_sqlite sqlite3; do
            if [ -f "$extension_dir/$extension.so" ]; then
              cp "$extension_dir/$extension.so" ".local-php-ext/$extension.so"
            fi
          done
          php -r 'printf("%s\n%s\n", PHP_VERSION, PHP_EXTENSION_DIR);' > .local-php-ext/runtime.txt

          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=database/database.sqlite \
            --exclude=storage/logs \
            -czf /tmp/reserva-local-validation.tgz .

      - name: Upload local validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: reserva-local-validation
          path: /tmp/reserva-local-validation.tgz
          retention-days: 1
