name: Build Azari Android Wrapper v1.0.1

on:
  push:
    branches:
      - android-wrapper-build-v1.0.1
    paths:
      - 'android-wrapper-v101/**'
      - '.github/workflows/build-azari-wrapper-v101.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release AAB
        working-directory: android-wrapper-v101
        run: gradle :app:bundleRelease --stacktrace

      - name: Run release lint
        working-directory: android-wrapper-v101
        run: |
          set +e
          gradle :app:lintRelease --stacktrace
          status=$?
          echo '----- FULL LINT REPORT -----'
          cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true
          exit $status

      - name: Upload unsigned AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azari-residences-v1.0.1-unsigned
          path: android-wrapper-v101/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
