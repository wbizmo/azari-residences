plugins {
    id 'com.android.application'
}

android {
    namespace 'com.azariresidences.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.azariresidences.app'
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
