<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#052058">
    <meta name="robots" content="noindex">
    <title>Offline | Resavar</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f7fb; color: #052058; }
        main { width: min(100%, 540px); padding: clamp(24px, 5vw, 48px); border-radius: 16px; background: #fff; border: 1px solid #d8e0ec; }
        h1 { margin: 0 0 16px; font-size: clamp(1.6rem, 5vw, 2.2rem); }
        p { line-height: 1.6; color: #283c61; }
        a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 8px; background: #052058; color: white; font-weight: 600; text-decoration: none; }
        a:focus-visible { outline: 3px solid #1b6ff0; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>Resavar can't load this page without a connection. Availability, booking prices, payments and trip updates must be verified online.</p>
        <p>No reservation or payment has been confirmed by this offline screen. Reconnect before trying again.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
